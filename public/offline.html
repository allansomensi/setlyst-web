<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setlyst — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #09090b;
        color: #fafafa;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      .icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        background: #fafafa;
        color: #09090b;
        border: none;
        border-radius: 0.5rem;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">📡</div>
      <h1 data-i18n="heading">You're offline</h1>
      <p data-i18n="body">
        This page hasn't been saved for offline use yet. Open it once with a
        connection — for example during soundcheck — and it'll be available
        offline afterwards.
      </p>
      <button onclick="location.reload()" data-i18n="button">Try again</button>
    </main>
    <script>
      // This file is served as-is by the service worker (public/sw.js) as a
      // last-resort fallback for any page that was never cached while
      // online. It has to work with zero network access and no build step,
      // so it can't use next-intl — instead it picks a language itself from
      // the URL the browser still shows (the address bar keeps the
      // originally-requested page's URL even though this file's markup is
      // what actually renders), falling back to the browser's own language.
      (function () {
        var DICT = {
          en: {
            title: "Setlyst — Offline",
            heading: "You're offline",
            body: "This page hasn't been saved for offline use yet. Open it once with a connection — for example during soundcheck — and it'll be available offline afterwards.",
            button: "Try again",
          },
          "pt-BR": {
            title: "Setlyst — Offline",
            heading: "Você está offline",
            body: "Esta página ainda não foi salva para uso sem internet. Abra-a uma vez com conexão — por exemplo durante a passagem de som — e ela ficará disponível offline depois.",
            button: "Tentar novamente",
          },
          es: {
            title: "Setlyst — Sin conexión",
            heading: "Estás sin conexión",
            body: "Esta página todavía no se guardó para uso sin conexión. Ábrela una vez con conexión — por ejemplo durante la prueba de sonido — y quedará disponible sin conexión después.",
            button: "Reintentar",
          },
        };
        var SUPPORTED = Object.keys(DICT);
        var DEFAULT_LOCALE = "en";

        function resolveLocale() {
          // 1. The app's own locale segment, e.g. "/pt-BR/dashboard/...".
          var segment = location.pathname.split("/")[1] || "";
          for (var i = 0; i < SUPPORTED.length; i++) {
            if (SUPPORTED[i].toLowerCase() === segment.toLowerCase()) {
              return SUPPORTED[i];
            }
          }
          // 2. Fall back to the browser's own language preference.
          var nav = (navigator.language || DEFAULT_LOCALE).toLowerCase();
          if (nav.indexOf("pt") === 0) return "pt-BR";
          if (nav.indexOf("es") === 0) return "es";
          return DEFAULT_LOCALE;
        }

        var strings = DICT[resolveLocale()] || DICT[DEFAULT_LOCALE];
        document.documentElement.lang = resolveLocale();
        document.title = strings.title;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (strings[key]) el.textContent = strings[key];
        });
      })();
    </script>
  </body>
</html>
