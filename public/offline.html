<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setlyst · Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #09090b;
        color: #fafafa;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      .icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        background: #fafafa;
        color: #09090b;
        border: none;
        border-radius: 0.5rem;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">📡</div>
      <h1 data-i18n="heading">You're offline</h1>
      <p data-i18n="body">
        This page hasn't been saved for offline use yet. Open it once with a
        connection (during soundcheck, for example) and it will be available
        offline afterwards.
      </p>
      <button id="retry" type="button" data-i18n="button">Try again</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
