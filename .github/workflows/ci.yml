name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so `next build` can run; nothing here is a real secret.
      NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
      NEXTAUTH_URL: https://www.example.com
      NEXTAUTH_SECRET: ci-only-secret-that-is-at-least-32-chars
      NEXT_TELEMETRY_DISABLED: "1"
      # This build is never deployed: allow the provider identification
      # placeholders (lib/legal.ts refuses them in real production builds).
      ALLOW_PLACEHOLDER_CONTROLLER: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit (production dependencies)
        run: pnpm audit --prod --audit-level high
